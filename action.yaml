name: "Enforce HTTPS for APT"
description: "Switch APT sources to HTTPS and refresh the package indexes"

inputs:
  http_fallback:
    description: "Allow HTTP only if the HTTPS update fails"
    default: "false"
  http_fallback_override:
    description: "Emergency HTTP fallback, wired from vars.APT_HTTP_FALLBACK"
    default: ""

outputs:
  transport:
    description: "Transport used for the successful APT update (https or http)"
    value: ${{ steps.apt.outputs.transport }}
  fallback_enabled:
    description: "Whether either switch enabled fallback"
    value: ${{ steps.apt.outputs.fallback_enabled }}
  fallback_source:
    description: "Switch that enabled fallback (input, override or none)"
    value: ${{ steps.apt.outputs.fallback_source }}
  container_bootstrap:
    description: "Absolute path to the POSIX shell container bootstrap"
    value: ${{ steps.apt.outputs.container_bootstrap }}

runs:
  using: "composite"
  steps:
    - name: "Enforce HTTPS for APT"
      id: apt
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HTTP_FALLBACK: ${{ inputs.http_fallback }}
        HTTP_FALLBACK_OVERRIDE: ${{ inputs.http_fallback_override }}
      run: |
        sudo --preserve-env=GITHUB_OUTPUT,GITHUB_STEP_SUMMARY \
          sh "$ACTION_PATH/apt-https.sh" \
          "$HTTP_FALLBACK" "$HTTP_FALLBACK_OVERRIDE"
        printf 'container_bootstrap=%s/container-bootstrap.sh\n' \
          "$ACTION_PATH" >> "$GITHUB_OUTPUT"
