---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: "Test APT HTTPS"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  https:
    name: "HTTPS only (${{ matrix.runner }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HTTPS_ENDPOINTS: >-
        github.com:443
        api.github.com:443
        codeload.github.com:443
        *.ubuntu.com:443
        azure.archive.ubuntu.com:443
        *.githubapp.com:443
        *.githubusercontent.com:443
        deb.debian.org:443
        packages.microsoft.com:443
        auth.docker.io:443
        registry-1.docker.io:443
        production.cloudflare.docker.com:443
        production.cloudfront.docker.com:443
        docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: "Harden runner (HTTPS-only block)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HTTPS_ENDPOINTS }}

      - name: "Verify block enforcement"
        shell: bash
        run: |
          # An unlisted hostname should resolve to the agent's sinkhole.
          resolved=$(getent ahostsv4 ubuntu.com)
          test "${resolved%% *}" = 54.185.253.63

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Record the hosted image's APT sources"
        shell: bash
        run: |
          printf 'Image: %s (%s, %s)\n' \
            "$ImageOS" "$ImageVersion" "$RUNNER_ARCH"
          cd /etc/apt
          for file in sources.list sources.list.d/*.list \
              sources.list.d/*.sources apt-mirrors.txt; do
            if [[ -f "$file" ]]; then
              printf '\n%s:\n' "$file"
              cat "$file"
            fi
          done

      - name: "Enforce HTTPS"
        uses: $/
        id: apt

      - name: "Validate runner APT"
        shell: bash
        env:
          TRANSPORT: ${{ steps.apt.outputs.transport }}
          FALLBACK_ENABLED: ${{ steps.apt.outputs.fallback_enabled }}
          FALLBACK_SOURCE: ${{ steps.apt.outputs.fallback_source }}
        run: |
          test "$TRANSPORT/$FALLBACK_ENABLED/$FALLBACK_SOURCE" \
            = https/false/none
          sudo apt-get update --error-on=any
          shopt -s nullglob
          parser="$GITHUB_WORKSPACE/apt-sources.awk"
          cd /etc/apt
          for file in sources.list sources.list.d/*.list \
              sources.list.d/*.sources; do
            [[ -f "$file" ]] || continue
            if grep -Ev '^[[:space:]]*#' "$file" | grep -nF 'http://'; then
              exit 1
            fi
            case "${file##*/}" in *[!A-Za-z0-9_.-]*) continue ;; esac
            case "$file" in *.sources) kind=deb822 ;; *) kind=list ;; esac
            mirrors=$(LC_ALL=C awk -v kind="$kind" -v mode=mirrors \
              -f "$parser" "$file")
            while IFS= read -r mirror; do
              [[ -n "$mirror" ]] || continue
              if [[ ! -f "$mirror" || ! -r "$mirror" ]]; then
                printf 'Cannot read APT mirror list: %s\n' "$mirror" >&2
                exit 1
              fi
              if grep -Ev '^[[:space:]]*#' "$mirror" | grep -nF 'http://'; then
                printf 'HTTP remains in APT mirror list: %s\n' "$mirror" >&2
                exit 1
              fi
            done <<< "$mirrors"
          done

      - name: "Validate pinned Ubuntu and Debian containers"
        shell: bash
        env:
          BOOTSTRAP: ${{ steps.apt.outputs.container_bootstrap }}
          # Multi-architecture indexes from the upstream allow-list probe.
          # yamllint disable rule:line-length
          UBUNTU: ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          DEBIAN: debian@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
          # yamllint enable rule:line-length
        run: |
          test -f "$BOOTSTRAP"
          action_dir=$(dirname "$BOOTSTRAP")
          host_ca=/etc/ssl/certs/ca-certificates.crt
          case "$RUNNER_ARCH" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) printf 'Unsupported runner architecture: %s\n' "$RUNNER_ARCH" >&2
               exit 1 ;;
          esac
          registry_get() {
            curl --fail --silent --show-error --proto '=https' --max-time 30 \
              --header @- "$@" <<< "Authorization: Bearer $token"
          }
          accept='application/vnd.oci.image.index.v1+json'
          accept+=', application/vnd.docker.distribution.manifest.list.v2+json'
          accept+=', application/vnd.oci.image.manifest.v1+json'
          accept+=', application/vnd.docker.distribution.manifest.v2+json'
          for image in "$UBUNTU" "$DEBIAN"; do
            repo="library/${image%@*}"
            registry="https://registry-1.docker.io/v2/$repo"
            token=$(curl --fail --silent --show-error --max-time 30 --get \
              --data-urlencode 'service=registry.docker.io' \
              --data-urlencode "scope=repository:$repo:pull" \
              https://auth.docker.io/token | jq -er '.token')
            manifest=$(registry_get --header "Accept: $accept" \
              "$registry/manifests/${image#*@}" | jq -er --arg arch "$arch" '
                first(.manifests[] | select(.platform.os == "linux"
                  and .platform.architecture == $arch) | .digest)')
            config=$(registry_get --header "Accept: $accept" \
              "$registry/manifests/$manifest" | jq -er '.config.digest')
            # Do not follow the redirect or log its signed URL.
            response=$(registry_get --output /dev/null \
              --write-out '%{http_code} %{redirect_url}' \
              "$registry/blobs/$config")
            redirect=${response#* }
            if [[ "$redirect" =~ ^https://([A-Za-z0-9.-]+)(:443)?/ ]]; then
              host=${BASH_REMATCH[1],,}
              printf '%s (%s) config blob redirects to %s\n' \
                "$image" "$arch" "$host"
              if [[ " $HTTPS_ENDPOINTS " != *" $host:443 "* ]]; then
                printf 'Docker Hub redirect host %s:443 is not allow-listed\n' \
                  "$host" >&2
                exit 1
              fi
            elif [[ "$response" == '200 ' ]]; then
              printf '%s (%s) config blob served directly by %s\n' \
                "$image" "$arch" registry-1.docker.io
            else
              printf 'Unexpected config response for %s (HTTP %s)\n' \
                "$image" "${response%% *}" >&2
              exit 1
            fi
          done
          for image in "$UBUNTU" "$DEBIAN"; do
            docker run --rm \
              --mount "type=bind,src=$action_dir,dst=/action,readonly" \
              --mount "type=bind,src=$host_ca,dst=/run/host-ca.pem,readonly" \
              "$image" sh "/action/$(basename "$BOOTSTRAP")" /run/host-ca.pem
          done

  fallback:
    name: "Fallback (${{ matrix.runner }}, ${{ matrix.switch }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        switch: ["off", input, override, invalid]
    steps:
      - name: "Harden runner (audit)"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Test source parsing, CA bootstrap and annotations"
        if: matrix.switch == 'off'
        run: sh tests/apt-https.sh

      - name: "Configure a loopback-only HTTP APT fixture"
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/apt-fixture" "$RUNNER_TEMP/saved-sources"
          cd "$RUNNER_TEMP/apt-fixture"
          : > Packages
          gzip -k Packages
          {
            printf 'Date: %s\nSHA256:\n' "$(date -Ru)"
            for index in Packages Packages.gz; do
              checksum=$(sha256sum "$index")
              printf ' %s %s %s\n' \
                "${checksum%% *}" "$(wc -c < "$index")" "$index"
            done
          } > Release
          # APT can read the empty flat repository over HTTP but cannot
          # negotiate TLS on the same socket.
          python3 -m http.server 18754 --bind 127.0.0.1 \
            --directory "$RUNNER_TEMP/apt-fixture" \
            > "$RUNNER_TEMP/http.log" 2>&1 &
          curl --silent --fail --retry 5 --retry-connrefused \
            --output /dev/null http://127.0.0.1:18754/
          shopt -s nullglob
          cd /etc/apt
          for file in sources.list sources.list.d/*.list \
              sources.list.d/*.sources; do
            [[ -e "$file" ]] || continue
            sudo mv "$file" "$RUNNER_TEMP/saved-sources/"
          done
          printf 'deb [trusted=yes] http://127.0.0.1:18754 ./\n' \
            | sudo tee /etc/apt/sources.list
          printf 'Acquire::Retries "0";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-test-loopback

      - name: "Run the action with the selected switch"
        uses: $/
        id: apt
        continue-on-error: >-
          ${{ matrix.switch == 'off' || matrix.switch == 'invalid' }}
        with:
          http_fallback: ${{ matrix.switch == 'input' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          http_fallback_override: ${{ matrix.switch == 'override' && 'true' || matrix.switch == 'invalid' && 'True' || '' }}

      - name: "Verify failure or explicit downgrade"
        shell: bash
        env:
          SWITCH: ${{ matrix.switch }}
          OUTCOME: ${{ steps.apt.outcome }}
          TRANSPORT: ${{ steps.apt.outputs.transport }}
          FALLBACK_ENABLED: ${{ steps.apt.outputs.fallback_enabled }}
          FALLBACK_SOURCE: ${{ steps.apt.outputs.fallback_source }}
        run: |
          http_request='"GET /(\./)?Release HTTP/'
          case "$SWITCH" in
            off|invalid)
              test "$OUTCOME" = failure
              if grep -E "$http_request" "$RUNNER_TEMP/http.log"; then
                exit 1
              fi
              ;;
            *)
              actual="$OUTCOME/$TRANSPORT/$FALLBACK_ENABLED/$FALLBACK_SOURCE"
              test "$actual" = "success/http/true/$SWITCH"
              grep -E "$http_request" "$RUNNER_TEMP/http.log"
              ;;
          esac
          grep -Fx 'deb [trusted=yes] http://127.0.0.1:18754 ./' \
            /etc/apt/sources.list
